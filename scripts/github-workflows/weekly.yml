name: Weekly content
# Щопонеділка перевіряє «запас» тижнів і, якщо його мало, генерує новий (потрібен секрет ANTHROPIC_API_KEY).
# Сайт сам відкриває тижні за датою релізу, тому цей воркфлоу лише поповнює чергу.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Згенерувати ще один тиждень попри запас'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate next week (if buffer is low)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-week.mjs --min-buffer 4 ${{ inputs.force && '--force' || '' }}
      - name: English overlays for new content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate-content.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Neural voice-over for new content
        run: |
          pip install edge-tts
          node scripts/build-audio.mjs
      - name: Commit and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "pewnie-bot"
            git config user.email "pewnie-bot@users.noreply.github.com"
            git add content
            git commit -m "content: new weekly pack"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          else
            echo "Nothing new to publish."
          fi
